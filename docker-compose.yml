# owncast-vod: records an Owncast stream into fixed-length VODs, served at /vods.
# All settings live in .env (cp .env.example .env), not in this file.
services:
  vods:
    build: .
    restart: unless-stopped
    # Host networking lets the recorder reach Owncast on 127.0.0.1 and lets
    # your reverse proxy reach the recorder on 127.0.0.1:PORT.
    # Owncast only on a Docker network? See README -> "Owncast on a Docker network".
    network_mode: host
    env_file: .env
    environment:
      BIND: ${BIND:-127.0.0.1}
      VOD_DIR: /vods
    volumes:
      - ${VOD_PATH:-./vods}:/vods

  # Optional cloud backup with rclone. Turn on with COMPOSE_PROFILES=backup in .env.
  backup:
    image: rclone/rclone:latest
    restart: unless-stopped
    profiles: [backup]
    env_file: .env
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ${VOD_PATH:-./vods}:/vods:ro
      - ./rclone:/config/rclone
      - ./cloud-backup.sh:/backup.sh:ro
