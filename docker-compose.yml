# owncast-vod: records your Owncast stream into 4-hour VODs, served at /vods.
# Settings live in .env (copy .env.example to .env), not in this file.
services:
  vods:
    build: .
    restart: unless-stopped
    network_mode: host            # reaches Owncast on 127.0.0.1, like CloudPanel's nginx
    env_file: .env
    environment:
      BIND: 127.0.0.1             # only reachable through nginx, not from the internet
      VOD_DIR: /vods
    volumes:
      - ${VOD_PATH:-./vods}:/vods

  # Optional Dropbox backup. Turn on with COMPOSE_PROFILES=dropbox in .env.
  dropbox:
    image: rclone/rclone:latest
    restart: unless-stopped
    profiles: [dropbox]
    env_file: .env
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ${VOD_PATH:-./vods}:/vods:ro
      - ./rclone:/config/rclone
      - ./dropbox-backup.sh:/backup.sh:ro
