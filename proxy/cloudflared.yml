# Cloudflare Tunnel (cloudflared config.yml): put the /vods rule ABOVE
# your existing Owncast rule for the same hostname.

ingress:
  - hostname: stream.example.com
    path: ^/vods
    service: http://localhost:8090
  - hostname: stream.example.com
    service: http://localhost:8080
  - service: http_status:404
