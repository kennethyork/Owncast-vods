# nginx (also CloudPanel, Plesk, aaPanel, HestiaCP, Nginx Proxy Manager "Advanced"):
# paste inside the server { } block that serves your Owncast domain (the one
# with "listen 443"), ABOVE the existing "location / {" block, then reload.
# Change 8090 if you changed PORT in .env.
# "^~" stops regex locations (e.g. CloudPanel's static-file rule for .mp4/.jpg)
# from stealing /vods/*.mp4 and thumbnails and sending them to Owncast.

  location ^~ /vods {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
  }
